# Netlify — https://docs.netlify.com/configure-builds/file-based-configuration/
[build]
  publish = "."
  command = "node build/build.mjs"   # regenerates HTML from build/content.mjs

[[headers]]
  for = "/assets/css/*"   # safe: HTML links use ?v=<content hash>
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
